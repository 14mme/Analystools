[project]
name = "analystools"
version = "0.1.0"
description = "A local-first analytical workbench for reproducible data analysis."
readme = "README.md"
requires-python = "==3.11.9"
license = { file = "LICENSE" }
authors = [
    { name = "Void" }
]
dependencies = [
    "duckdb>=1.4,<2.0",
    "pydantic>=2.0,<3.0",
    "pyarrow>=18.0,<23.0",
    "polars>=1.0,<2.0",
    "typer>=0.16,<1.0",
]

[project.scripts]
analystools = "analystools.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analystools"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true